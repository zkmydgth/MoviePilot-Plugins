name: Test p115strmhelper (V3)

on:
  push:
    paths:
      - 'plugins.v3/p115strmhelper/**'
      - '.github/workflows/test-p115strmhelper-v3.yml'
  pull_request:
    paths:
      - 'plugins.v3/p115strmhelper/**'
      - '.github/workflows/test-p115strmhelper-v3.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 只跑 Linux：MoviePilot V3 实际运行于 Linux 容器（Python 3.14），
        # 而 pyahocorasick 等扩展上游只提供 Linux 的 cp314 wheel，
        # Windows/macOS 跑不出有效结论，反而会因 wheel 缺失误报失败。
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout plugin code
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          # 与 MoviePilot V3 运行环境保持一致：V3 使用 Python 3.14。
          # 在此版本下，requirements.txt 中带 python_version < "3.13" 标记的
          # Rust 加速扩展会被自动跳过，插件走纯 Python 降级路径——
          # 这正是线上真实行为，所以测试必须在 3.14 上跑才有意义。
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: plugins.v3/p115strmhelper/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --find-links plugins.v3/p115strmhelper/wheels -r plugins.v3/p115strmhelper/requirements.txt

      - name: Run tests (host stub)
        env:
          PYTHONPATH: ${{ github.workspace }}/plugins.v3/p115strmhelper/tests/_stub_host:${{ github.workspace }}/plugins.v3/p115strmhelper
        run: |
          python -m unittest discover -s plugins.v3/p115strmhelper/tests -p "test_*.py" -v
