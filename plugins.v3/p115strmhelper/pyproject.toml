[project]
name = "moviepilot-plugin-p115strmhelper"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "p115client==0.0.9.6.5.1",
    "sentry-sdk~=2.67.1",
    "aligo~=6.2.8",
    "qrcode_terminal~=0.8",
    "pyahocorasick>=2.3.1",
    "diskcache~=5.6.3",
    "zstandard~=0.25.0",
    "mfusepy~=3.1.0",
    "p115center-sdk==0.0.17",
    "slippers-proxy~=0.3.0",
    "orjson",
    "numpy",
    "cachetools",
    "httpx[http2]",
    # Rust 加速扩展（可选）：上游目前只发布 cp312 ABI 的 wheel，
    # MoviePilot V3 运行在 Python 3.14（cp314）上装不了，
    # 声明为必需依赖会让 uv 整体解析失败、插件无法安装。
    # 加环境标记后在 3.13+ 自动跳过，插件走纯 Python 降级路径（功能完整，仅慢一些）。
    "full_strm_sync==0.1.6; python_version < '3.13'",
    "txt_tree_storage==0.2.1; python_version < '3.13'",
    "share_strm_scan==0.2.2; python_version < '3.13'",
]
