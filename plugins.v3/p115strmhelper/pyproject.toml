[project]
name = "moviepilot-plugin-p115strmhelper"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    # 成对依赖与 API 改名说明见 requirements.txt 顶部注释（已按 0.0.9.7.x 适配）。
    "p115client==0.0.9.7.2",
    "sentry-sdk~=2.71.0",
    "aligo~=6.2.8",
    "qrcode_terminal~=0.8",
    "pyahocorasick>=2.3.1",
    "diskcache~=5.6.3",
    "zstandard~=0.25.0",
    "mfusepy~=3.1.0",
    "p115center-sdk==0.0.17",
    "slippers-proxy~=0.3.0",
    "orjson",
    "numpy",
    "cachetools",
    "httpx[http2]",
    # Rust 加速扩展（可选）：不在 PyPI 上，以 wheel 随插件 wheels/ 分发，
    # 上游构建矩阵已含 cp312 与 cp314 → 3.12 与 3.14 宿主都能装并启用；
    # 3.13 无对应 wheel，显式排除以免解析失败。装不上时走纯 Python 降级路径。
    "full_strm_sync==0.1.6; python_version < '3.13' or python_version == '3.14'",
    "txt_tree_storage==0.2.1; python_version < '3.13' or python_version == '3.14'",
    "share_strm_scan==0.2.2; python_version < '3.13' or python_version == '3.14'",
]
